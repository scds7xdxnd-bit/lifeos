name: Private Alpha Invite Sheet Sync

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  sync-invite-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: lifeos/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r lifeos/requirements.txt
          pip install google-api-python-client google-auth

      - name: Sync private alpha invite sheet
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PRIVATE_ALPHA_SHEET_ID: ${{ secrets.PRIVATE_ALPHA_SHEET_ID }}
          PRIVATE_ALPHA_SHEET_WORKSHEET: ${{ secrets.PRIVATE_ALPHA_SHEET_WORKSHEET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing" >&2
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is missing" >&2
            exit 1
          fi
          if [ -z "$PRIVATE_ALPHA_SHEET_ID" ]; then
            echo "PRIVATE_ALPHA_SHEET_ID secret is missing" >&2
            exit 1
          fi

          WORKSHEET="${PRIVATE_ALPHA_SHEET_WORKSHEET:-invites}"

          python scripts/ops/private_alpha_invite_sheet_sync.py \
            --sheet-id "$PRIVATE_ALPHA_SHEET_ID" \
            --worksheet "$WORKSHEET"

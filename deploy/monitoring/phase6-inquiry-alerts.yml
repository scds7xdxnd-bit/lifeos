      - alert: Phase8CrossDomainPairLowCoverageHigh
        expr: |
          max by (domain, profile_version, strategy_version) (
            lifeos:inquiry_low_coverage_rate_by_domain_profile:ratio{expert_mode="true",domain=~"finance\\+habits|projects\\+skills|habits\\+journal|habits\\+health|calendar\\+projects|journal\\+relationships"}
          ) > 0.55
          and
          sum by (domain, profile_version, strategy_version) (
            rate(lifeos_inquiry_generated_by_domain_total{expert_mode="true",domain=~"finance\\+habits|projects\\+skills|habits\\+journal|habits\\+health|calendar\\+projects|journal\\+relationships"}[15m])

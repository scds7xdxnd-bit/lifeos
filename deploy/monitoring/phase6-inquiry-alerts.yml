            lifeos:timeline_insufficiency_rate_by_profile:ratio{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects"}
          ) > 0.85
          and
          sum by (domain, profile, profile_version, strategy_version) (
            rate(lifeos_timeline_profile_usage_total{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects"}[15m])
          ) > 0.003
        for: 15m
        labels:
          severity: warning
          phase: "9"
        annotations:
          summary: "Phase 9 temporal insufficiency rate high"
          description: "Temporal insufficiency exceeded 0.85 per generated timeline summary for one or more Phase 9 profiles."

      - alert: Phase9TimelineBlockedClaimsSpike
        expr: |
          max by (domain, profile, profile_version, strategy_version) (
            lifeos:timeline_blocked_claims_rate_by_profile:ratio{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects"}
          ) > 0.1
          and
          sum by (domain, profile, profile_version, strategy_version) (
            rate(lifeos_timeline_profile_usage_total{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects"}[15m])
          ) > 0.003
        for: 10m
        labels:
          severity: warning
          phase: "9"
        annotations:
          summary: "Phase 9 timeline blocked-claim spike"
          description: "Blocked forbidden temporal claims exceeded 0.10 per timeline summary for an active Phase 9 profile."

      - alert: Phase9TimelineReplayMismatchDetected
        expr: |
          sum(increase(lifeos_timeline_replay_mismatch_total{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects"}[15m])) by (domain, profile, profile_version, strategy_version) > 0
          and
          sum by (domain, profile, profile_version, strategy_version) (
            rate(lifeos_timeline_profile_usage_total{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects"}[15m])
          ) > 0.001
        for: 5m
        labels:
          severity: critical
          phase: "9"
        annotations:
          summary: "Phase 9 timeline replay mismatch detected"
          description: "Replay mismatch detected for one or more active Phase 9 timeline profiles."

      - alert: Phase9TimelineOutputPresenceLow
        expr: |
          min by (domain) (
            lifeos:timeline_output_presence_rate_by_domain:ratio{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects"}
          ) < 0.85
          and
          sum by (domain) (
            rate(lifeos_inquiry_generated_by_domain_total{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects"}[15m])
          ) > 0.005
        for: 15m
        labels:
          severity: warning
          phase: "9"
        annotations:
          summary: "Phase 9 timeline output presence low"
          description: "Timeline metadata presence dropped below 85% for at least one Phase 9 rollout domain/pair under active inquiry traffic."

      - alert: Phase9TimelineProfileVersionUnexpected
        expr: |
          sum(rate(lifeos_timeline_profile_usage_total{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects",profile_version!="1.0.0"}[15m])) > 0
          or
          sum(rate(lifeos_timeline_profile_usage_total{domain=~"finance|habits|projects|skills|calendar|finance\\+habits|projects\\+skills|calendar\\+projects",strategy_version!="1.0.0"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
          phase: "9"
        annotations:
          summary: "Phase 9 timeline profile/strategy version drift detected"
          description: "Phase 9 timeline usage includes unexpected profile_version or strategy_version labels."

      - alert: Phase10HumanizationRenderLatencyHigh
        expr: |
          max by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            lifeos:inquiry_humanization_render_latency_p95_by_domain_profile:seconds
          ) > 0.25
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_humanization_render_by_domain_total[15m])
          ) > 0.005
        for: 10m
        labels:
          severity: warning
          phase: "10"
        annotations:
          summary: "Phase 10 humanization render latency high"
          description: "Humanization render p95 exceeded 250ms for one or more active inquiry profiles."

      - alert: Phase10HumanizationFailureRateHigh
        expr: |
          max by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            lifeos:inquiry_humanization_failure_rate_by_domain_profile:ratio
          ) > 0.08
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_humanization_render_by_domain_total[15m])
          ) > 0.005
        for: 10m
        labels:
          severity: warning
          phase: "10"
        annotations:
          summary: "Phase 10 humanization failure rate high"
          description: "Humanization render failures exceeded 8% for one or more active inquiry profiles."

      - alert: Phase10HumanizationFallbackRateHigh
        expr: |
          max by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            lifeos:inquiry_humanization_fallback_rate_by_domain_profile:ratio
          ) > 0.2
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_humanization_render_by_domain_total[15m])
          ) > 0.005
        for: 15m
        labels:
          severity: warning
          phase: "10"
        annotations:
          summary: "Phase 10 fallback-to-canonical rate high"
          description: "Fallback to canonical rendering exceeded 20% for at least one active inquiry profile."

      - alert: Phase10HumanizationEquivalenceViolationDetected
        expr: |
          sum(increase(lifeos_inquiry_humanization_equivalence_violation_by_domain_total[15m])) by (domain, profile, profile_version, strategy, strategy_version, expert_mode) > 0
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_humanization_render_by_domain_total[15m])
          ) > 0.001
        for: 5m
        labels:
          severity: critical
          phase: "10"
        annotations:
          summary: "Phase 10 humanization equivalence violation detected"
          description: "Explicit canonical/humanized equivalence violation was recorded under active humanization traffic."

      - alert: Phase10HumanizedOutputPresenceLow
        expr: |
          min by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            lifeos:inquiry_humanized_output_presence_rate_by_domain_profile:ratio
          ) < 0.8
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_humanization_render_by_domain_total[15m])
          ) > 0.005
        for: 15m
        labels:
          severity: warning
          phase: "10"
        annotations:
          summary: "Phase 10 humanized output presence low"
          description: "Humanized output presence dropped below 80% for an active inquiry profile."

      - alert: Phase10HumanizationVersionUnexpected
        expr: |
          sum(rate(lifeos_inquiry_humanization_version_total{humanization_version!="phase10_humanization_v1"}[15m])) > 0
        for: 10m
        labels:

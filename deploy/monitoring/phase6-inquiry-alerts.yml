          description: "One or more later-wave expert profiles exceeded a 50% low-coverage rate."

      - alert: Phase71LaterWaveRefineAfterLowQualityHigh
        expr: |
          max by (domain, profile_version, strategy_version) (
            lifeos:inquiry_refine_after_low_quality_rate_by_domain_profile:ratio{expert_mode="true",domain=~"journal|relationships|health"}
          ) > 0.65

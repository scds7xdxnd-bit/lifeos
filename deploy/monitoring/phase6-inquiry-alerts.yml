          description: "One or more Phase 8 pair profiles exceeded a 60% refine-after-low-coverage ratio."

      - alert: Phase8CrossDomainPairBlockedClaimsSpike
        expr: |
          max by (domain, profile_version, strategy_version) (
            lifeos:inquiry_blocked_claims_rate_by_domain_profile:ratio{expert_mode="true",domain=~"finance\\+habits|projects\\+skills|habits\\+journal|habits\\+health|calendar\\+projects|journal\\+relationships"}
          ) > 0.1

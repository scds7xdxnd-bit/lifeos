      - alert: Phase81ProductizationErrorRateHigh
        expr: |
          max by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            lifeos:inquiry_productization_error_rate_by_domain_profile:ratio
          ) > 0.12
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_productization_by_domain_total[15m])
          ) > 0.005
        for: 10m
        labels:
          severity: warning
          phase: "8.1"
        annotations:
          summary: "Phase 8.1 productization error rate high"
          description: "One or more inquiry profiles exceeded a 12% productization-stage error rate."

      - alert: Phase81ProductizationLatencyHigh
        expr: |
          max by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            lifeos:inquiry_productization_latency_p95_by_domain_profile:seconds
          ) > 0.75
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_productization_by_domain_total[15m])
          ) > 0.005
        for: 10m
        labels:
          severity: warning
          phase: "8.1"
        annotations:
          summary: "Phase 8.1 productization latency high"
          description: "One or more inquiry profiles exceeded 750ms productization p95 latency."

      - alert: Phase81WeakAnswerRateHigh
        expr: |
          max by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            lifeos:inquiry_weak_answer_rate_by_domain_profile:ratio
          ) > 0.7
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_answerability_by_domain_total[15m])
          ) > 0.005
        for: 15m
        labels:

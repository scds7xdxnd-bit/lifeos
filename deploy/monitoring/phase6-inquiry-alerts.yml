          ) > 0.6
          and
          sum by (domain, profile_version, strategy_version) (
            rate(lifeos_inquiry_refined_by_domain_total{expert_mode="true",domain=~"finance\\+habits|projects\\+skills|habits\\+journal|habits\\+health|calendar\\+projects|journal\\+relationships"}[15m])

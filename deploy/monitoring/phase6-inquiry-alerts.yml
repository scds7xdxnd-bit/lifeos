      - alert: Phase8CrossDomainPairReplayMismatchDetected
        expr: |
          sum(rate(lifeos_inquiry_replay_mismatch_by_domain_total{expert_mode="true",domain=~"finance\\+habits|projects\\+skills|habits\\+journal|habits\\+health|calendar\\+projects|journal\\+relationships"}[15m])) by (domain, profile_version, strategy_version) > 0
        for: 5m
        labels:
          severity: critical
          phase: "8"
        annotations:
          summary: "Phase 8 pair-profile replay mismatch detected"
          description: "Replay mismatch was detected for a Phase 8 pair profile under identical normalized input scope."

      - alert: Phase8CrossDomainPairProfileVersionUnexpected
        expr: |
          sum(rate(lifeos_inquiry_generated_by_domain_total{expert_mode="true",domain=~"finance\\+habits|projects\\+skills|habits\\+journal|habits\\+health|calendar\\+projects|journal\\+relationships",profile_version!="1.0.0"}[15m])) > 0
          or
          sum(rate(lifeos_inquiry_generated_by_domain_total{expert_mode="true",domain=~"finance\\+habits|projects\\+skills|habits\\+journal|habits\\+health|calendar\\+projects|journal\\+relationships",strategy_version!="1.0.0"}[15m])) > 0

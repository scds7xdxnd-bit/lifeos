        annotations:
          summary: "Phase 8.1 weak-answer rate high"
          description: "Weak answerability exceeded 70% for one or more inquiry profiles."

      - alert: Phase81DirectAnswerPresenceLow
        expr: |
          min by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            lifeos:inquiry_direct_answer_presence_rate_by_domain_profile:ratio
          ) < 0.55
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_productization_by_domain_total[15m])
          ) > 0.005
        for: 20m
        labels:
          severity: warning
          phase: "8.1"
        annotations:
          summary: "Phase 8.1 direct-answer presence low"
          description: "Direct-answer presence dropped below 55% for a sustained period under active productization traffic."

      - alert: Phase81ProductizationReplayMismatchDetected
        expr: |
          sum(increase(lifeos_inquiry_replay_mismatch_by_domain_total[15m])) by (domain, profile, profile_version, strategy, strategy_version, expert_mode) > 0
          and
          sum by (domain, profile, profile_version, strategy, strategy_version, expert_mode) (
            rate(lifeos_inquiry_productization_by_domain_total[15m])
          ) > 0.001
        for: 5m
        labels:
          severity: critical
          phase: "8.1"
        annotations:

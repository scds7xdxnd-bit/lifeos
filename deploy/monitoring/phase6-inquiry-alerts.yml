        expr: |
          sum(rate(lifeos_inquiry_generated_by_domain_total{expert_mode="true",domain=~"journal|relationships|health",profile_version!="1.0.0"}[15m])) > 0
          or
          sum(rate(lifeos_inquiry_generated_by_domain_total{expert_mode="true",domain=~"journal|relationships|health",strategy_version!="1.0.0"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
          phase: "7.1"
        annotations:
          summary: "Phase 7.1 profile/strategy version drift detected"
          description: "Later-wave domain expert traffic includes unexpected profile_version or strategy_version labels."

      - alert: Phase8CrossDomainPairErrorRateHigh
        expr: |
          max by (domain, profile_version, strategy_version) (

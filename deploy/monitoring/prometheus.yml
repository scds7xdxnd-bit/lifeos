global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'lifeos-monitor'
    environment: '{{ ENVIRONMENT }}'

# Load rules for alert conditions
rule_files:
  - 'rules.yml'
  - 'phase3b-alerts.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # LifeOS Web Application (host machine)
  - job_name: 'lifeos'
    static_configs:
      - targets:
          - 'lifeos-web:8000'
          - 'host.docker.internal:5001'
          - 'host.docker.internal:8000'

  # StatsD Exporter (collects application metrics)
  - job_name: 'statsd-exporter'
    static_configs:
      - targets: ['statsd-exporter:9102']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'statsd_.*'
        action: keep

  # PostgreSQL Database
  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
        labels:
          service: 'postgres'

  # Redis Cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'

  # Container metrics from cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_name]
        regex: '^/?(lifeos-.*)'
        target_label: container
        replacement: '$1'
      - source_labels: [__name__]
        regex: 'container_.*'
        action: keep
    scrape_interval: 30s

# Service discovery for dynamic environments (optional)
# Uncomment for Kubernetes or Consul service discovery

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'lifeos-monitor'
    environment: '{{ ENVIRONMENT }}'

# Load rules for alert conditions
rule_files:
  - 'rules.yml'
  - 'phase3b-alerts.yml'
  - 'phase6-inquiry-alerts.yml'
  - 'phase12d-habits-alerts.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # LifeOS Web Application (Docker network)
  - job_name: 'lifeos'
    static_configs:
      - targets:
          - 'web:8000'

  # StatsD Exporter (collects application metrics)
  - job_name: 'statsd-exporter'
    static_configs:
      - targets: ['statsd-exporter:9102']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'statsd_.*'
        action: keep

  # NOTE:
  # Do not scrape raw database/cache TCP ports with Prometheus HTTP scrapes.
  # Use postgres_exporter / redis_exporter endpoints if DB/Redis metrics are needed.

  # Container metrics from cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_name]
        regex: '^/?(lifeos-.*)'
        target_label: container
        replacement: '$1'
      - source_labels: [__name__]
        regex: 'container_.*'
        action: keep
    scrape_interval: 30s

# Service discovery for dynamic environments (optional)
# Uncomment for Kubernetes or Consul service discovery
